footprint: [[-0.25, -0.20], [-0.25, 0.20], [0.20, 0.20], [0.20, -0.20]]
footprint_padding: 0.02
robot_base_frame: base_link
transform_tolerance: 0.5

obstacle_layer:
  enabled: true
  obstacle_range: 3.0
  raytrace_range: 3.5
  track_unknown_space: false
  combination_method: 1
  observation_sources: laser_scan
  laser_scan:
    sensor_frame: laser
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  cost_scaling_factor: 5.0
  inflation_radius: 0.45
