DWAPlannerROS:
  # max_vel_x / max_vel_trans são reconfigurados dinamicamente pelo Maestro
  max_vel_trans: 0.5
  min_vel_trans: 0.05
  max_vel_x: 0.5
  min_vel_x: -0.1
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 1.0
  min_vel_theta: 0.2
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5

  # Tolerâncias de goal (apertadas por causa do C4)
  xy_goal_tolerance: 0.03
  yaw_goal_tolerance: 0.03
  latch_xy_goal_tolerance: false

  sim_time: 2.0
  sim_granularity: 0.025
  vx_samples: 12
  vy_samples: 1
  vth_samples: 30
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  oscillation_reset_dist: 0.05
  publish_cost_grid: false
